[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-literature-search"
version = "0.1.0"
description = "Undermind-style deep literature search agent: iterative search over Semantic Scholar / OpenAlex, citation snowballing, per-paper match scoring, and cited reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.scripts]
dls = "dls.cli:main"

[tool.setuptools]
packages = ["dls", "dls.clients"]
